[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://jdub-deploy.njcreative123.workers.dev/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
