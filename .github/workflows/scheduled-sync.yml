name: ⏰ Daily Data Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Trending Movies (TMDB)
        id: movies
        run: |
          curl -s "https://api.themoviedb.org/3/trending/movie/week?language=hi-IN" \
            -H "accept: application/json" > trending_movies.json
          echo "Movies fetched" >> $GITHUB_STEP_SUMMARY

      - name: Fetch Popular Books (Open Library)
        id: books
        run: |
          curl -s "https://openlibrary.org/search.json?q=popular&limit=20" > popular_books.json
          echo "Books fetched" >> $GITHUB_STEP_SUMMARY

      - name: Push Data Update
        run: |
          git config user.name "JDUB Hub Bot"
          git config user.email "bot@jdub-hub.com"
          git add -A
          git diff --cached --quiet || git commit -m "📊 Daily data sync $(date +%Y-%m-%d)" && git push

      - name: Notify
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=📊 Daily sync complete!" || true
