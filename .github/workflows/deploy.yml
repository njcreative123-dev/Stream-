name: ⚡ JDUB Hub Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-heliohost:
    name: 🌐 Deploy to HelioHost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to HelioHost via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set ssl:verify-certificate no; \
            open -u ${{ secrets.HELIOHOST_FTP_USER }},'${{ secrets.HELIOHOST_FTP_PASS }}' johnny.heliohost.org; \
            mirror -R --verbose --delete public/ httpdocs/ --exclude .git/"

  deploy-cloudflare:
    name: ☁️ Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: deploy-heliohost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy src/workers/index.js --name jdub-hub-worker

  notify:
    name: 📱 Notify Telegram
    runs-on: ubuntu-latest
    needs: [deploy-heliohost, deploy-cloudflare]
    steps:
      - name: Send Deploy Notification
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ *JDUB Hub Deployed!*

🌐 Website: https://njcreative123.helioho.st/
🤖 GitHub: https://github.com/njcreative123-dev/Stream-
⚡ All 6 AI Workers: Online

Deployed by GitHub Actions CI/CD 🚀" \
            -d "parse_mode=Markdown"
