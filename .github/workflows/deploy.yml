name: ⚡ Full Stack Deploy (HelioHost + Cloudflare + GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # 1. Deploy static site to HelioHost (Free hosting)
  deploy-heliohost:
    name: 🌐 HelioHost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set ssl:verify-certificate no; \
            open -u ${{ secrets.HELIOHOST_FTP_USER }},'${{ secrets.HELIOHOST_FTP_PASS }}' johnny.heliohost.org; \
            mirror -R --verbose --delete public/ httpdocs/ --exclude .git/"

  # 2. Deploy to Cloudflare Pages (Free CDN)
  deploy-pages:
    name: ⚡ Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=jdub-hub

  # 3. Deploy Worker
  deploy-worker:
    name: ☁️ Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy src/workers/index.js --name jdub-hub-worker

  # 4. Publish GitHub Pages (free static hosting)
  gh-pages:
    name: 📦 GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 5. Notify Telegram
  notify:
    name: 📱 Notify
    runs-on: ubuntu-latest
    needs: [deploy-heliohost, deploy-pages, deploy-worker, gh-pages]
    if: always()
    steps:
      - name: Send Telegram Notification
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ *JDUB Hub Deployed!*

🌐 HelioHost: https://njcreative123.helioho.st/
⚡ Cloudflare Pages: https://jdub-hub.pages.dev/
☁️ Worker: https://jdub-deploy.njcreative123.workers.dev/
📦 GitHub Pages: https://njcreative123-dev.github.io/Stream-/

All free services online 🚀" \
            -d "parse_mode=Markdown"
