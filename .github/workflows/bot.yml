name: 🤖 JDUB Hub GitHub Bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process Bot Commands
        id: commands
        run: |
          BODY="${{ github.event.comment.body || github.event.issue.body || '' }}"
          
          if echo "$BODY" | grep -qi "/status"; then
            SUMMARY="### ⚡ JDUB Hub Status
            | Service | Status |
            |---------|--------|
            | HelioHost | ✅ Online |
            | Cloudflare Pages | ✅ Online |
            | Cloudflare Worker | ✅ Online |
            | GitHub Pages | ✅ Online |
            | Telegram Bot | ✅ Online |
            | D1 Database | ✅ Ready |
            | KV Cache | ✅ Ready |
            | R2 Storage | ✅ Ready |"
            echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "REPLY=**Service Status:** Sab online! ✅" >> $GITHUB_ENV
          elif echo "$BODY" | grep -qi "/deploy"; then
            echo "REPLY=🚀 Deploy triggered via workflow_dispatch! Naya push wait karo ya Actions tab me run karo." >> $GITHUB_ENV
          elif echo "$BODY" | grep -qi "/help"; then
            echo "REPLY=**Commands:** /status, /deploy, /help" >> $GITHUB_ENV
          fi

      - name: Post Comment on Issue/PR
        if: env.REPLY != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reply = process.env.REPLY;
            const context = github.context;
            let owner = context.repo.owner;
            let repo = context.repo.repo;
            let issueNumber;
            if (context.payload.issue) {
              issueNumber = context.payload.issue.number;
            } else if (context.payload.pull_request) {
              issueNumber = context.payload.pull_request.number;
            }
            if (issueNumber && reply) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: reply
              });
            }

      - name: Star Thank You on Issue Open
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            if (context.payload.issue) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: context.payload.issue.number,
                body: '🙏 Thanks for reporting! JDUB Hub team will look into this ASAP.'
              });
            }

      - name: Send Telegram Update
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=🤖 GitHub Bot: New activity on JDUB Hub repo" \
            -d "parse_mode=Markdown"
